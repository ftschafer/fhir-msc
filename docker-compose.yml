services:
  hapi-fhir-jpaserver-start:
    build:
      # Build from current local workspace
      context: "."
      dockerfile: "Dockerfile"
    container_name: hapi-fhir-jpaserver-start
    restart: on-failure
    environment:
      # Database
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:postgresql://hapi-fhir-postgres:5432/hapi}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-admin}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-admin}"
      SPRING_DATASOURCE_DRIVERCLASSNAME: "${SPRING_DATASOURCE_DRIVERCLASSNAME:-org.postgresql.Driver}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"

      # Location layer
      HAPI_FHIR_LOCATION_BLOCK: "${HAPI_FHIR_LOCATION_BLOCK:-B71}"

      # Socioeconomic analysis / income configuration
      HAPI_FHIR_ANALYSIS_SOCIOECONOMIC_INCOME_EXTENSION_URL: "${HAPI_FHIR_ANALYSIS_SOCIOECONOMIC_INCOME_EXTENSION_URL:-http://average-income}"
      HAPI_FHIR_ANALYSIS_SOCIOECONOMIC_FIXED_BLOCK_INCOME: "${HAPI_FHIR_ANALYSIS_SOCIOECONOMIC_FIXED_BLOCK_INCOME:-3200}"

      # Block health measure report metadata
      HAPI_FHIR_MEASURE_REPORT_BLOCK_HEALTH_AVG_INCOME: "${HAPI_FHIR_MEASURE_REPORT_BLOCK_HEALTH_AVG_INCOME:-3200}"
      HAPI_FHIR_MEASURE_REPORT_BLOCK_HEALTH_CARE_UNITS: "${HAPI_FHIR_MEASURE_REPORT_BLOCK_HEALTH_CARE_UNITS:-4}"

      # Forwarding target (set empty to disable in code, or point to another FHIR base URL)
      UPSTREAM_FHIR_BASE_URL: "${UPSTREAM_FHIR_BASE_URL:-http://18.224.17.42:8081/fhir}"
      # JVM memory/GC defaults for bulk ingestion stability
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms1g -Xmx3g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError}"
    volumes:
      - ./custom:/app/custom
      - ./configs:/app/configs
    ports:
      - "8071:8071"
  hapi-fhir-postgres:
    image: postgres:15-alpine
    container_name: hapi-fhir-postgres
    restart: always
    environment:
      POSTGRES_DB: "hapi"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
