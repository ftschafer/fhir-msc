<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS2 City Aggregation Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .subtitle {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .controls {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .control-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    label {
      font-weight: 500;
      color: #333;
    }

    input[type="text"] {
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 4px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5568d3;
    }

    .auto-refresh-note {
      margin-left: auto;
      font-size: 0.85em;
      color: #555;
      background: #eef2ff;
      border: 1px solid #d9e1ff;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .summary-label {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-value {
      font-size: 2.5em;
      font-weight: bold;
      color: #667eea;
    }

    .city-container,
    .blocks-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .block-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .block-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.15);
    }

    .block-header {
      border-bottom: 3px solid #667eea;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .block-name {
      font-size: 1.5em;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .block-location {
      font-size: 0.9em;
      color: #666;
    }

    .block-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .stat-item {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
    }

    .stat-label {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.5em;
      font-weight: bold;
      color: #667eea;
    }

    .stat-value.average { color: #764ba2; }
    .stat-value.patients { color: #f093fb; }

    .section-title {
      color: white;
      margin: 30px 0 20px 0;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      border: 1px solid #f5c6cb;
    }

    .empty {
      background: white;
      padding: 40px;
      border-radius: 8px;
      text-align: center;
      color: #666;
    }

    .vital-list {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ececec;
    }

    .vital-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.86em;
      padding: 4px 0;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .trend-card {
      background: white;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .trend-title { font-size: 0.95em; font-weight: 600; color: #333; margin-bottom: 4px; }
    .trend-subtitle { font-size: 0.8em; color: #666; margin-bottom: 8px; }
    .trend-current { font-size: 1.05em; color: #667eea; font-weight: 700; margin-bottom: 8px; }
    .trend-svg {
      width: 100%;
      height: 120px;
      display: block;
      background: #fafbff;
      border: 1px solid #edf0ff;
      border-radius: 6px;
    }

    @media (max-width: 768px) {
      .block-stats { grid-template-columns: 1fr; }
      h1 { font-size: 1.8em; }
      .summary { grid-template-columns: 1fr; }
      .control-group { flex-direction: column; align-items: stretch; }
      .auto-refresh-note { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NEWS2 City Dashboard</h1>
      <p class="subtitle">Real-time health aggregation by city and block · v2.2</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <label for="cityFilter">Filter by City:</label>
        <input type="text" id="cityFilter" placeholder="e.g., C91 (leave empty for all)">

        <label for="blockFilter">Filter by Block:</label>
        <input type="text" id="blockFilter" placeholder="e.g., B01 (optional)">

        <button onclick="loadDashboard()">Load</button>
        <span class="auto-refresh-note" id="status">Auto-refresh: every 5s</span>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <script>
    const REFRESH_MS = 5000;
    const TREND_WINDOW_MS = 60 * 60 * 1000; // 1 hour
    const MAX_POINTS = 5000; // safety cap
    const TREND_STORAGE_KEY = 'cityVitalTrendHistory.v1';
    let autoRefreshHandle = null;
    let isLoadingDashboard = false;
    const cityVitalTrendHistory = new Map();

    function pruneTrendSeries(series, nowMs) {
      if (!series || !Array.isArray(series.times)) return;
      while (series.times.length > 0 && (nowMs - series.times[0]) > TREND_WINDOW_MS) {
        series.values.shift();
        series.labels.shift();
        series.times.shift();
      }
      while (series.values.length > MAX_POINTS) {
        series.values.shift();
        series.labels.shift();
        series.times.shift();
      }
    }

    function saveTrendHistory() {
      try {
        const payload = [];
        cityVitalTrendHistory.forEach((series, key) => {
          payload.push([key, series]);
        });
        localStorage.setItem(TREND_STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        // ignore storage issues
      }
    }

    function loadTrendHistoryFromStorage() {
      try {
        const raw = localStorage.getItem(TREND_STORAGE_KEY);
        if (!raw) return;
        const entries = JSON.parse(raw);
        if (!Array.isArray(entries)) return;

        const nowMs = Date.now();
        entries.forEach(entry => {
          if (!Array.isArray(entry) || entry.length !== 2) return;
          const key = entry[0];
          const series = entry[1];
          if (!key || !series) return;

          const hydrated = {
            city: series.city || '',
            vitalSign: series.vitalSign || '',
            unit: series.unit || '',
            values: Array.isArray(series.values) ? series.values.map(v => Number(v || 0)) : [],
            labels: Array.isArray(series.labels) ? series.labels.map(v => String(v || '')) : [],
            times: Array.isArray(series.times) ? series.times.map(v => Number(v || 0)) : []
          };
          pruneTrendSeries(hydrated, nowMs);
          if (hydrated.values.length > 0) {
            cityVitalTrendHistory.set(key, hydrated);
          }
        });
      } catch (e) {
        // ignore malformed storage
      }
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text ?? '').replace(/[&<>"']/g, m => map[m]);
    }

    function getRiskLevelBadge(score) {
      if (score >= 7) return '🔴 HIGH';
      if (score >= 5) return '🟡 MEDIUM';
      return '🟢 LOW';
    }

    function buildUrl() {
      const cityFilter = document.getElementById('cityFilter').value.trim();
      const params = new URLSearchParams();
      if (cityFilter) params.set('city', cityFilter);
      params.set('_ts', Date.now().toString());
      return `/fhir/Patient/$dashboard-stats?${params.toString()}`;
    }

    function makeCityTrendKey(city, vitalSign) {
      return `${city || ''}::${vitalSign || ''}`;
    }

    function appendCityVitalTrendPoints(data) {
      if (!data || !Array.isArray(data.cityStats)) return;
            const nowMs = Date.now();
            const timestamp = new Date(nowMs).toLocaleTimeString();

      data.cityStats.forEach(cs => {
        const city = cs.city || '';
        const vitals = Array.isArray(cs.vitalSignAverages) ? cs.vitalSignAverages : [];
        vitals.forEach(v => {
          const key = makeCityTrendKey(city, v.vitalSign);
          if (!cityVitalTrendHistory.has(key)) {
            cityVitalTrendHistory.set(key, {
              city,
              vitalSign: v.vitalSign || '',
              unit: v.unit || '',
              values: [],
              labels: [],
              times: []
            });
          }
          const series = cityVitalTrendHistory.get(key);
          series.unit = v.unit || series.unit || '';
          series.values.push(Number(v.averageValue || 0));
          series.labels.push(timestamp);
          series.times.push(nowMs);
          pruneTrendSeries(series, nowMs);
        });
      });

      saveTrendHistory();
    }

    function buildPolylinePoints(values, width, height) {
      if (!values || values.length === 0) return '';
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = (max - min) || 1;
      const left = 10;
      const right = width + 10;
      const top = 10;
      const bottom = height + 10;

      if (values.length === 1) {
        const y = bottom - ((values[0] - min) / range) * height;
        return `${left},${y} ${right},${y}`;
      }

      return values.map((v, idx) => {
        const x = left + (idx / (values.length - 1)) * width;
        const y = bottom - ((v - min) / range) * height;
        return `${x.toFixed(2)},${y.toFixed(2)}`;
      }).join(' ');
    }

    function renderCityTrendCharts(data) {
      if (!data || !Array.isArray(data.cityStats)) {
        return '<div class="empty">No trend data available</div>';
      }

      const nowMs = Date.now();
      cityVitalTrendHistory.forEach(series => pruneTrendSeries(series, nowMs));

      let html = '<div class="trend-grid">';
      let hasAny = false;
      const visibleCities = new Set((data.cityStats || []).map(cs => cs.city || ''));
      cityVitalTrendHistory.forEach(series => {
        if (!series || !Array.isArray(series.values) || series.values.length === 0) return;
        if (visibleCities.size > 0 && !visibleCities.has(series.city || '')) return;

        hasAny = true;
        const points = buildPolylinePoints(series.values, 300, 100);
        const current = series.values[series.values.length - 1];
        const min = Math.min(...series.values);
        const max = Math.max(...series.values);

        html += `
          <div class="trend-card">
            <div class="trend-title">${escapeHtml(series.vitalSign)}</div>
            <div class="trend-subtitle">City: ${escapeHtml(series.city || '')}</div>
            <div class="trend-current">${Number(current).toFixed(4)} ${escapeHtml(series.unit || '')}</div>
            <svg class="trend-svg" viewBox="0 0 320 120" preserveAspectRatio="none">
              <line x1="10" y1="110" x2="310" y2="110" stroke="#d9def7" stroke-width="1" />
              <line x1="10" y1="10" x2="10" y2="110" stroke="#d9def7" stroke-width="1" />
              <polyline fill="none" stroke="#667eea" stroke-width="2.2" points="${points}" />
            </svg>
            <div class="trend-subtitle">Min: ${Number(min).toFixed(4)} · Max: ${Number(max).toFixed(4)} · Points: ${series.values.length} · Window: last 60m</div>
          </div>
        `;
      });

      html += '</div>';
      if (!hasAny) return '<div class="empty">No city vital-sign trend samples yet.</div>';
      return html;
    }

    function renderDashboard(data) {
      const content = document.getElementById('content');
      const blockFilter = document.getElementById('blockFilter').value.trim().toLowerCase();

      const cityStats = Array.isArray(data.cityStats) ? data.cityStats : [];
      const allBlocks = Array.isArray(data.blockStats) ? data.blockStats : [];
      const blockStats = blockFilter
        ? allBlocks.filter(b => String(b.block || '').toLowerCase().includes(blockFilter))
        : allBlocks;

      let html = '';

      html += '<div class="summary">';
      html += `
        <div class="summary-card">
          <div class="summary-label">Total Patients</div>
          <div class="summary-value">${Number(data.totalPatients || 0)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Total Conditions</div>
          <div class="summary-value">${Number(data.totalConditions || 0)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Average NEWS2</div>
          <div class="summary-value">${Number(data.avgNews2 || 0).toFixed(1)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Visible Blocks</div>
          <div class="summary-value">${blockStats.length}</div>
        </div>
      `;
      html += '</div>';

      if (cityStats.length > 0) {
        html += '<h2 class="section-title">City Averages</h2>';
        html += '<div class="city-container">';
        cityStats.forEach(city => {
          const avg = Number(city.avgNews2 || 0);
          const cityVitals = Array.isArray(city.vitalSignAverages) ? city.vitalSignAverages : [];
          html += `
            <div class="block-card">
              <div class="block-header">
                <div class="block-name">${escapeHtml(city.city || 'Unknown')}</div>
                <div class="block-location">City aggregate</div>
              </div>
              <div class="block-stats">
                <div class="stat-item">
                  <div class="stat-label">Patients</div>
                  <div class="stat-value patients">${Number(city.patientCount || 0)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Conditions</div>
                  <div class="stat-value">${Number(city.conditionCount || 0)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Avg NEWS2</div>
                  <div class="stat-value average">${avg.toFixed(1)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Risk Level</div>
                  <div class="stat-value">${getRiskLevelBadge(avg)}</div>
                </div>
              </div>
              <div class="vital-list">
                <div class="stat-label" style="margin-bottom:6px;">Vital Sign Averages</div>
                ${cityVitals.length > 0
                  ? cityVitals.map(v => `
                    <div class="vital-row">
                      <span>${escapeHtml(v.vitalSign || 'unknown')}</span>
                      <strong>${Number(v.averageValue || 0).toFixed(2)} ${escapeHtml(v.unit || '')}</strong>
                    </div>`).join('')
                  : '<div class="vital-row"><span>No vital-sign averages found</span></div>'}
              </div>
            </div>
          `;
        });
        html += '</div>';
      }

      html += '<h2 class="section-title">City Vital Sign Trends (Live)</h2>';
      html += renderCityTrendCharts(data);

      const neighborhoodStats = Array.isArray(data.neighborhoodStats) ? data.neighborhoodStats : [];
      if (neighborhoodStats.length > 0) {
        html += '<h2 class="section-title">Neighborhood Averages</h2>';
        html += '<div class="city-container">';
        neighborhoodStats
          .sort((a, b) => String(a.neighborhood || '').localeCompare(String(b.neighborhood || '')))
          .forEach(n => {
            const avg = Number(n.avgNews2 || 0);
            const nVitals = Array.isArray(n.vitalSignAverages) ? n.vitalSignAverages : [];
            html += `
            <div class="block-card">
              <div class="block-header">
                <div class="block-name">${escapeHtml(n.neighborhood || 'Unknown')}</div>
                <div class="block-location">${escapeHtml(n.city || 'Unknown city')}</div>
              </div>
              <div class="block-stats">
                <div class="stat-item">
                  <div class="stat-label">Patients</div>
                  <div class="stat-value patients">${Number(n.patientCount || 0)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Conditions</div>
                  <div class="stat-value">${Number(n.conditionCount || 0)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Avg NEWS2</div>
                  <div class="stat-value average">${avg.toFixed(1)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Risk Level</div>
                  <div class="stat-value">${getRiskLevelBadge(avg)}</div>
                </div>
              </div>
              <div class="vital-list">
                <div class="stat-label" style="margin-bottom:6px;">Vital Sign Averages</div>
                ${nVitals.length > 0
                  ? nVitals.map(v => `
                    <div class="vital-row">
                      <span>${escapeHtml(v.vitalSign || 'unknown')}</span>
                      <strong>${Number(v.averageValue || 0).toFixed(2)} ${escapeHtml(v.unit || '')}</strong>
                    </div>`).join('')
                  : '<div class="vital-row"><span>No vital-sign averages found</span></div>'}
              </div>
            </div>
          `;
          });
        html += '</div>';
      }

      if (blockStats.length > 0) {
        html += '<h2 class="section-title">Block Details</h2>';
        html += '<div class="blocks-container">';

        blockStats.sort((a, b) => String(a.block || '').localeCompare(String(b.block || '')));

        blockStats.forEach(block => {
          const avg = Number(block.avgNews2 || 0);
          const blockVitals = Array.isArray(block.vitalSignAverages) ? block.vitalSignAverages : [];
          html += `
            <div class="block-card">
              <div class="block-header">
                <div class="block-name">${escapeHtml(block.block || 'Unknown')}</div>
                <div class="block-location">${escapeHtml(block.neighborhood || 'Unknown neighborhood')} • ${escapeHtml(block.city || 'Unknown city')}</div>
              </div>
              <div class="block-stats">
                <div class="stat-item">
                  <div class="stat-label">Patients</div>
                  <div class="stat-value patients">${Number(block.patientCount || 0)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Conditions</div>
                  <div class="stat-value">${Number(block.conditionCount || 0)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Avg NEWS2</div>
                  <div class="stat-value average">${avg.toFixed(1)}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Risk Level</div>
                  <div class="stat-value">${getRiskLevelBadge(avg)}</div>
                </div>
              </div>
              <div class="vital-list">
                <div class="stat-label" style="margin-bottom:6px;">Vital Sign Averages</div>
                ${blockVitals.length > 0
                  ? blockVitals.map(v => `
                    <div class="vital-row">
                      <span>${escapeHtml(v.vitalSign || 'unknown')}</span>
                      <strong>${Number(v.averageValue || 0).toFixed(2)} ${escapeHtml(v.unit || '')}</strong>
                    </div>`).join('')
                  : '<div class="vital-row"><span>No vital-sign averages found</span></div>'}
              </div>
            </div>
          `;
        });

        html += '</div>';
      } else {
        html += '<div class="empty">No block data available for current filters.</div>';
      }

      content.innerHTML = html;
    }

    async function loadDashboard(showLoading = true) {
      if (isLoadingDashboard) return;
      isLoadingDashboard = true;

      const content = document.getElementById('content');
      const status = document.getElementById('status');

      if (showLoading) {
        content.innerHTML = '<div class="empty">Loading dashboard data...</div>';
      }

      try {
        const response = await fetch(buildUrl(), { cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
                appendCityVitalTrendPoints(data);
        renderDashboard(data);
        status.textContent = `Last update: ${new Date().toLocaleTimeString()} · Auto-refresh: every 5s`;
      } catch (error) {
        content.innerHTML = `
          <div class="error">
            <strong>Error:</strong> ${escapeHtml(error.message)}<br>
            <small>Make sure the FHIR server is running and endpoint /fhir/Patient/$dashboard-stats is accessible.</small>
          </div>
        `;
        status.textContent = 'Failed to refresh';
      } finally {
        isLoadingDashboard = false;
      }
    }

    function startAutoRefresh() {
      if (autoRefreshHandle) clearInterval(autoRefreshHandle);
      autoRefreshHandle = setInterval(() => loadDashboard(false), REFRESH_MS);
    }

    window.addEventListener('load', () => {
      loadTrendHistoryFromStorage();
      loadDashboard(true);
      startAutoRefresh();
    });
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS2 City Aggregation Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      text-align: center;
      color: white;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2.3em;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.25);
    }

    .subtitle { font-size: 1.05em; opacity: 0.92; }

    .controls {
      background: white;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

      display: flex;

    }

    label { font-weight: 600; color: #333; }

    input[type="text"] {
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 0.95em;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 10px 18px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95em;
      cursor: pointer;
    }

    button:hover { background: #5568d3; }

    .status-note {
      margin-left: auto;
      font-size: 0.85em;
      color: #4b5563;
      background: #eef2ff;
      border: 1px solid #d9e1ff;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .summary-label {
      color: #666;
      font-size: 0.82em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 2.2em;
      font-weight: 700;
      color: #667eea;
    }

    .section-title {
      color: white;
      margin: 20px 0 12px;
      font-size: 1.2em;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .data-card {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card-header {
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 1.2em;
      color: #111827;
      font-weight: 700;
    }

    .card-subtitle {
      font-size: 0.85em;
      color: #6b7280;
      margin-top: 4px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.92em;
    }

    .stats-row:last-child { border-bottom: none; }

    .stat-name { color: #6b7280; }
    .stat-number { color: #374151; font-weight: 700; }

    .empty {
      background: white;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 14px;
      border-radius: 6px;
      border: 1px solid #f5c6cb;
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.8em; }
      .control-group { flex-direction: column; align-items: stretch; }
      .status-note { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NEWS2 City Dashboard</h1>
      <p class="subtitle">Real-time city-level aggregation with block breakdown</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <label for="cityFilter">Filter by City:</label>
        <input type="text" id="cityFilter" placeholder="e.g., C91 (leave empty for all)">

        <label for="blockFilter">Filter by Block:</label>
        <input type="text" id="blockFilter" placeholder="e.g., B01 (optional)">

        <button id="loadBtn">Load</button>
        <span class="status-note" id="status">Auto-refresh: every 5s</span>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <script>
    const REFRESH_MS = 5000;
    let autoRefreshHandle = null;
    let isLoading = false;

    function riskLabel(score) {
      const value = Number(score || 0);
      if (value >= 7) return '🔴 HIGH';
      if (value >= 5) return '🟡 MEDIUM';
      return '🟢 LOW';
    }

    function escapeHtml(text) {
      const raw = String(text ?? '');
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return raw.replace(/[&<>"']/g, m => map[m]);
    }

    function buildUrl() {
      const cityFilter = document.getElementById('cityFilter').value.trim();
      const params = new URLSearchParams();
      if (cityFilter) params.set('city', cityFilter);
      params.set('_ts', Date.now().toString());
      const query = params.toString();
      return `/fhir/Patient/$dashboard-stats${query ? '?' + query : ''}`;
    }

    function renderDashboard(data) {
      const content = document.getElementById('content');
      const blockFilter = document.getElementById('blockFilter').value.trim().toLowerCase();

      const allBlocks = Array.isArray(data.blockStats) ? data.blockStats : [];
      const blockStats = blockFilter
        ? allBlocks.filter(b => String(b.block || '').toLowerCase().includes(blockFilter))
        : allBlocks;

      let html = '';
      html += '<div class="summary">';
      html += `
        <div class="summary-card">
          <div class="summary-label">Total Patients</div>
          <div class="summary-value">${Number(data.totalPatients || 0)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Total NEWS2</div>
          <div class="summary-value">${Number(data.totalScore || 0)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Average NEWS2</div>
          <div class="summary-value">${Number(data.avgNews2 || 0).toFixed(1)}</div>
        </div>
      `;
      html += '</div>';

      const cityStats = Array.isArray(data.cityStats) ? data.cityStats : [];
      if (cityStats.length > 0) {
        html += '<h2 class="section-title">City Overview</h2>';
        html += '<div class="cards-grid">';
        cityStats.forEach(c => {
          html += `
            <div class="data-card">
              <div class="card-header">
                <div class="card-title">${escapeHtml(c.city || 'Unknown')}</div>
                <div class="card-subtitle">City aggregate</div>
              </div>
              <div class="stats-row"><span class="stat-name">Patients</span><span class="stat-number">${Number(c.patientCount || 0)}</span></div>
              <div class="stats-row"><span class="stat-name">Total NEWS2</span><span class="stat-number">${Number(c.totalScore || 0)}</span></div>
              <div class="stats-row"><span class="stat-name">Avg NEWS2</span><span class="stat-number">${Number(c.avgNews2 || 0).toFixed(1)}</span></div>
              <div class="stats-row"><span class="stat-name">Risk</span><span class="stat-number">${riskLabel(c.avgNews2)}</span></div>
            </div>
          `;
        });
        html += '</div>';
      }

      if (blockStats.length > 0) {
        html += '<h2 class="section-title">Block Details</h2>';
        html += '<div class="cards-grid">';

        blockStats.sort((a, b) => String(a.block || '').localeCompare(String(b.block || '')));

        blockStats.forEach(b => {
          html += `
            <div class="data-card">
              <div class="card-header">
                <div class="card-title">${escapeHtml(b.block || 'Unknown')}</div>
                <div class="card-subtitle">${escapeHtml(b.neighborhood || 'Unknown neighborhood')} • ${escapeHtml(b.city || 'Unknown city')}</div>
              </div>
              <div class="stats-row"><span class="stat-name">Patients</span><span class="stat-number">${Number(b.patientCount || 0)}</span></div>
              <div class="stats-row"><span class="stat-name">Total NEWS2</span><span class="stat-number">${Number(b.totalScore || 0)}</span></div>
              <div class="stats-row"><span class="stat-name">Avg NEWS2</span><span class="stat-number">${Number(b.avgNews2 || 0).toFixed(1)}</span></div>
              <div class="stats-row"><span class="stat-name">Risk</span><span class="stat-number">${riskLabel(b.avgNews2)}</span></div>
            </div>
          `;
        });

        html += '</div>';
      } else {
        html += '<div class="empty">No block data available for current filter.</div>';
      }

      content.innerHTML = html;
    }

    async function loadDashboard(showLoading = true) {
      if (isLoading) return;
      isLoading = true;

      const statusEl = document.getElementById('status');
      const content = document.getElementById('content');

      if (showLoading) {
        content.innerHTML = '<div class="empty">Loading dashboard data...</div>';
      }

      try {
        const response = await fetch(buildUrl(), { cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        const data = await response.json();
        renderDashboard(data);
        statusEl.textContent = `Last update: ${new Date().toLocaleTimeString()} · Auto-refresh: every 5s`;
      } catch (e) {
        content.innerHTML = `<div class="error"><strong>Error:</strong> ${escapeHtml(e.message)}</div>`;
        statusEl.textContent = 'Failed to refresh';
      } finally {
        isLoading = false;
      }
    }

    function startAutoRefresh() {
      if (autoRefreshHandle) clearInterval(autoRefreshHandle);
      autoRefreshHandle = setInterval(() => loadDashboard(false), REFRESH_MS);
    }

    document.getElementById('loadBtn').addEventListener('click', () => loadDashboard(true));
    window.addEventListener('load', () => {
      loadDashboard(true);
      startAutoRefresh();
    });
  </script>
</body>
</html>
